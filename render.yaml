# Optional Render Blueprint. Existing Render services do not automatically adopt
# this file; verify the connected repository, branch and Root Directory in Render.
# All five snapshot/control workbook IDs also exist in config/gsheet_snapshots.json and
# are read server-side by the Node API. No OAuth credentials are stored in git.
# Dual mode requires a published CONTROL ACTIVE pair (A/A2 or B/B2). v15 loads the
# committed generation's PACKED_SNAPSHOT into memory and full-scans every BP; until the
# Windows sync has written PACKED_SNAPSHOT it falls back to the keyed v14 engine.
# See MEMORY_FULL_SCAN_V15.md. Free/0.1 CPU instances sleep and are ~10x slower.
services:
  - type: web
    name: bp-duplicate-check-koyeb
    runtime: node
    repo: https://github.com/sahamgorengancuan-prog/-mdg-bp-duplicate-checker-vercel
    branch: main
    buildCommand: yarn install
    startCommand: yarn start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GSHEET_SNAPSHOT_MODE
        value: dual
      - key: SNAPSHOT_ENGINE
        value: memory
      - key: SHEET_A_ID
        value: 1vll0y7dO4bVTokeLbWctUUKjQvOV33V9TDp9iZfJPhA
      - key: SHEET_B_ID
        value: 13yMsb_Vsi6eXDkau1zouaRi2viOefDkVHmIuK9SHLqk
      - key: SHEET_A2_ID
        value: 1Qov9_QDbDwwLOOr3z7a2gCtA82dQXfy5bkKdAuwyDoA
      - key: SHEET_B2_ID
        value: 1ju8u0vpMTVxIfi9J-VgwpIqj5rvTbmVW83pzHSXi3Sc
      - key: SHEET_CONTROL_ID
        value: 1wnRHX84FXNG3zwoxDofr1dzj1vu6UsN3uo907xt3KJ4
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REFRESH_TOKEN
        sync: false
      - key: SHEET_ID
        sync: false
